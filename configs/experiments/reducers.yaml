# Which projection should you trust?
#
# One embedder, eight reducers. Because a run computes each embedding once and
# reuses it, this costs barely more than a single-reducer run — and it shows
# directly how much of a clustered-looking figure comes from the reducer rather
# than from the representation.
#
# Read three columns together:
#   trustworthiness       did the projection invent structure?
#   continuity            did it destroy structure?
#   distance_correlation  did it preserve distances *between* clusters?
#
# `random_projection` is the control. It fits nothing, so whatever structure
# survives it was robust to begin with — and any reducer that does not clearly
# beat it is not earning its place.
pfam:
  version: "35.0"
  families:
    - PF00069   # Pkinase       — protein kinase domain
    - PF00072   # Response_reg  — two-component response regulator
    - PF00001   # 7tm_1         — 7TM receptor, rhodopsin-family GPCR

data:
  cache_dir: data/raw
  min_seq_length: 50
  max_per_family: 60

results_dir: results
cache_embeddings: true
save_figures: true

embedders:
  - name: kmer
    k: 3

reducers:
  # Linear, deterministic
  - name: pca
  - name: svd               # LSA; consumes the sparse matrix directly
  - name: random_projection # the control
  # Manifold
  - name: umap
    n_neighbors: 15
    min_dist: 0.1
    metric: cosine
  - name: tsne
    perplexity: 30
  - name: isomap            # geodesic; keeps global structure
    n_neighbors: 10
  - name: mds               # literal picture of the distance matrix
  - name: kernel_pca        # non-linear but deterministic
    kernel: cosine

metrics:
  groups: [projection, classification, clustering]
