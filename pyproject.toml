[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prot2vec"
version = "0.1.0"
description = "Benchmarking protein sequence vectorization techniques"
requires-python = ">=3.11"
dependencies = [
    "biopython>=1.81",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "umap-learn>=0.5",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "requests>=2.31",
    "pyyaml>=6.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
esm = [
    "torch>=2.0",
    "fair-esm>=2.0",
]
llm = [
    "google-genai>=1.0",
    "python-dotenv>=1.0",
]
dev = [
    "pytest>=7.4",
    "pytest-cov",
    "jupyter",
    "ipykernel",
]

[project.scripts]
prot2vec-benchmark = "scripts.run_benchmark:main"
prot2vec-download = "scripts.download_data:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["prot2vec*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"
