# Full benchmark: 5 families, all three embedders including ESM-2.
pfam:
  version: "35.0"
  families:
    - PF00069   # Protein kinase
    - PF00072   # GPCR
    - PF00001   # 7 transmembrane receptor (rhodopsin)
    - PF00004   # ATPase
    - PF00005   # ABC transporter

data:
  cache_dir: data/raw
  min_seq_length: 50

results_dir: results
cache_embeddings: true
save_figures: true

embedders:
  - name: composition
  - name: kmer
    k: 3
  - name: esm2
    model_key: esm2_t12_35M
    batch_size: 16
    max_len: 512

reducer:
  name: umap
  n_neighbors: 15
  min_dist: 0.1
  metric: cosine
