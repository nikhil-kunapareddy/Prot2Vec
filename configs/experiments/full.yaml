# Full benchmark: 5 families, all three embedders including ESM-2.
pfam:
  version: "35.0"
  families:
    - PF00069   # Pkinase       — protein kinase domain
    - PF00072   # Response_reg  — two-component response regulator
    - PF00001   # 7tm_1         — 7TM receptor, rhodopsin-family GPCR
    - PF00004   # AAA           — ATPase associated with diverse activities
    - PF00005   # ABC_tran      — ABC transporter ATP-binding domain

data:
  cache_dir: data/raw
  min_seq_length: 50

results_dir: results
cache_embeddings: true
save_figures: true

embedders:
  - name: composition
  - name: kmer
    k: 3
  - name: esm2
    model_key: esm2_t12_35M
    batch_size: 16
    max_len: 512

reducer:
  name: umap
  n_neighbors: 15
  min_dist: 0.1
  metric: cosine
